<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03150c"/>
      <stop offset="0.55" stop-color="#062615"/>
      <stop offset="1" stop-color="#02100a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#00c46f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00c46f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#00ff9c" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="23" height="23" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#00ff9c" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#00ff9c" stroke-opacity="0.16" stroke-width="1.4">
    <path d="M120 220 H420 V360 H700"/>
    <path d="M1500 160 V420 H1760"/>
    <path d="M980 900 V700 H1300 V560"/>
    <path d="M260 820 H560 V960"/>
    <path d="M1700 760 H1420 V980"/>
    <path d="M820 120 H1040 V60"/>
  </g>
  <g fill="#00ff9c" fill-opacity="0.55">
    <circle cx="420" cy="220" r="4"/><circle cx="700" cy="360" r="4"/>
    <circle cx="1500" cy="160" r="4"/><circle cx="1760" cy="420" r="4"/>
    <circle cx="1300" cy="560" r="4"/><circle cx="560" cy="820" r="4"/>
    <circle cx="1420" cy="760" r="4"/><circle cx="1040" cy="120" r="4"/>
  </g>

  <!-- faint magnifier / fingerprint motif -->
  <g transform="translate(1330 470)" opacity="0.5" filter="url(#soft)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#00ff9c" stroke-opacity="0.22" stroke-width="10"/>
    <ellipse cx="0" cy="0" rx="92" ry="150" fill="none" stroke="#00ff9c" stroke-opacity="0.20" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="60" ry="118" fill="none" stroke="#00ff9c" stroke-opacity="0.20" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="28" ry="86" fill="none" stroke="#00ff9c" stroke-opacity="0.20" stroke-width="4"/>
    <line x1="120" y1="120" x2="250" y2="250" stroke="#00ff9c" stroke-opacity="0.30" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- scanlines -->
  <g opacity="0.06">
    <rect y="0" width="1920" height="2" fill="#00ff9c"/>
    <rect y="6" width="1920" height="1" fill="#00ff9c"/>
    <rect y="12" width="1920" height="1" fill="#00ff9c"/>
    <rect y="18" width="1920" height="2" fill="#00ff9c"/>
  </g>
</svg>
